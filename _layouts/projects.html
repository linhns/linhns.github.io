---
layout: base
---

<div class="projects">
  {%- if page.title -%}
    <h1 class="page-heading">{{ page.title }}</h1>
  {%- endif -%}

  {{ content }}

  <ul class="project-list">
    {% for project in site.projects %}
      <li>
        <a class="project-link" href="{{ project.url }}">{{ project.title }}</a><br>
        <small>{{ project.description }}</small>
      </li>
    {% endfor %}
  </ul>
</div>
