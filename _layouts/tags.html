---
layout: base
---

<div class="tags">
  {%- if page.title -%}
    <h1 class="page-heading">{{ page.title }}</h1>
  {%- endif -%}
  {{ content }}
  <ul class="all-tags">
    {% assign tags_list = site.tags | sort %}
    {% for tag in tags_list %}
      {% assign slug = tag[0] | slugify %}
      <li>
        <a href="{{ '/tags/' | append: slug | relative_url }}">{{ tag[0] }}</a>
        <span>({{ tag[1].size }})</span>
      </li>
    {% endfor %}
  </ul>
</div>
