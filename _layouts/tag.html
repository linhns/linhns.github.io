---
layout: base
---

<div class="blog-index">
  <header class="blog-header">
    <h1 class="page-heading">Posts tagged "{{ page.tag | escape }}"</h1>
    <p class="browse-tags">
      <a href="{{ '/tags/' | relative_url }}">← Back to all tags</a>
    </p>
  </header>

  {{ content }}
  {% assign posts = site.tags[page.tag] %}
  {% include blog-posts.html posts=posts %}
</div>
